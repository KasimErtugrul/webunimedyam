<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
        Kampüs yayınlarını, dersleri ve topluluk videolarını keşfetmeye devam et.
      </p>
</div>
<!-- Login Form Card -->
<div class="w-full bg-surface-container-low rounded-xl p-space-lg shadow-md flex flex-col gap-space-md">
<!-- Email Input Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1.5" for="email-input">
<span>E-Posta veya Öğrenci Adresi</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[20px]">
            mail
          </span>
<input class="w-full h-12 pl-11 pr-space-md bg-surface-container-high rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-colors" id="email-input" placeholder="ogrenci@universite.edu.tr veya e-posta" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="password-input">
<span>Şifre</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline pointer-events-none text-[20px]">
            lock
          </span>
<input class="w-full h-12 pl-11 pr-12 bg-surface-container-high rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-bright transition-colors" id="password-input" placeholder="••••••••" type="password"/>
<button aria-label="Şifreyi Göster/Gizle" class="absolute right-space-sm h-9 w-9 flex items-center justify-center text-outline hover:text-primary transition-colors rounded-lg active:scale-95" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end -mt-1">
<a class="font-label-md text-label-md text-primary hover:text-secondary-fixed transition-colors" href="#forgot">

</div>
<!-- Submit CTA Button -->
<button class="w-full h-12 mt-space-xs bg-primary text-on-primary font-label-lg text-label-lg rounded-lg shadow-sm flex items-center justify-center gap-2 hover:bg-primary-fixed-dim active:scale-[0.98] transition-all" id="login-btn" type="button">
<span>Giriş Yap</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="flex items-center my-space-xs">
<div class="flex-grow h-px bg-surface-container-highest"></div>
<span class="px-space-md font-label-sm text-label-sm text-outline uppercase tracking-wider">veya</span>
<div class="flex-grow h-px bg-surface-container-highest"></div>
</div>
<!-- Google Sign-In Button -->
<button class="w-full h-12 bg-surface-container-high text-on-surface font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-space-md hover:bg-surface-bright active:scale-[0.98] transition-all" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Google ile devam et</span>
</button>
<!-- Guest Access Action -->
<button class="w-full h-11 bg-transparent text-on-surface-variant font-label-md text-label-md rounded-lg flex items-center justify-center gap-1.5 hover:text-on-surface hover:bg-surface-container transition-all active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[18px]">explore</span>
<span>Giriş yapmadan göz at (Misafir)</span>
</button>
</div>
<!-- Register Footer Redirect -->
<div class="mt-space-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        Henüz hesabın yok mu?
        <a class="font-label-lg text-label-lg text-primary hover:text-secondary-fixed ml-1 inline-flex items-center gap-0.5" href="#register">
<span>Kayıt Ol</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>
</a>
</p>
</div>
<!-- Campus Live Video Stream Preview Accent Teaser -->
<div class="w-full mt-space-xl p-space-md rounded-xl bg-surface-container-low flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm min-w-0">
<div class="relative w-10 h-10 rounded-lg bg-surface-container-highest flex items-center justify-center shrink-0 overflow-hidden">
<span class="material-symbols-outlined text-primary text-[22px]">podcasts</span>
<span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-error animate-ping"></span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Şu An Yayında</span>
<span class="font-label-md text-label-md text-on-surface truncate">İTÜ Robotik Zirvesi 2025</span>
</div>
</div>
<div class="flex items-center gap-1 px-space-sm py-1 rounded-full bg-surface-container-high shrink-0">
<span class="w-1.5 h-1.5 rounded-full bg-error"></span>
<span class="font-label-sm text-label-sm text-on-surface">1.4k</span>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const loginBtn = document.getElementById('login-btn');
    if (loginBtn) {
      loginBtn.addEventListener('click', function() {
        loginBtn.classList.add('opacity-80');
        setTimeout(() => {
          loginBtn.classList.remove('opacity-80');
        }, 300);
      });
    }
  })();
</script></main></body></html>
